name: Assemble correct Rutinas app

on:
  push:
    paths:
      - '.github/workflows/assemble-correct-app.yml'
      - 'deploy/correct-html.part*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble correct app
        run: |
          cat deploy/correct-html.part00.b64 deploy/correct-html.part01.b64 deploy/correct-html.part02.b64 deploy/correct-html.part03.b64 | base64 -d | gzip -d > index.html
          test $(wc -c < index.html) -gt 200000
          grep -q 'Nueva tarea' index.html
          grep -q 'Recordatorio' index.html
          grep -q 'Subtareas' index.html
      - name: Commit correct app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Replace simplified app with correct Rutinas Diarias build'
            git push
          fi
